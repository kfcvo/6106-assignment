<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <title>6101 Deposit</title>
    <style>
        /* 复用之前的 CSS 样式以保持完全一致 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* 表单组样式 */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        input[type="text"], 
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            margin: 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
            background-color: #fafafa;
        }

        /* 地址输入框使用等宽字体 */
        input[type="text"] {
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 13px;
        }

        input:focus {
            border-color: #2ecc71; /* 存款页面可以用绿色作为焦点色 */
            outline: none;
            background-color: #fff;
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        /* 存款主要按钮 - 使用绿色系表示"入账" */
        .btn-primary {
            background-color: #2ecc71; 
            color: white;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
        }
        .btn-primary:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        /* 查询按钮 */
        .btn-secondary {
            background-color: #34495e; /* 深色沉稳 */
            color: white;
            box-shadow: 0 4px 6px rgba(52, 73, 94, 0.3);
        }
        .btn-secondary:hover {
            background-color: #2c3e50;
            transform: translateY(-2px);
        }

        /* 返回按钮 */
        .btn-back {
            background-color: transparent;
            color: #888;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        .btn-back:hover {
            background-color: #f1f1f1;
            color: #333;
        }

        /* 结果展示区 */
        .transaction-result {
            margin-top: 25px;
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #2ecc71; /* 绿色边条 */
            text-align: left;
        }

        .transaction-result p {
            margin: 8px 0;
            font-size: 13px;
            color: #555;
            font-family: monospace;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏦 Deposit Money</h2>
        
        <div class="form-group">
            <label for="depositor">Depositor Address</label>
            <input type="text" id="depositor" placeholder="0x...">
        </div>

        <div class="form-group">
            <label for="amount">Deposit Amount</label>
            <input type="number" id="amount" placeholder="0">
        </div>

        <button class="btn btn-primary" onclick="deposit()">💰 Confirm Deposit</button>
        <button class="btn btn-secondary" onclick="view_transaction()">📄 View Transaction</button>
        
        <div class="transaction-result">
            <p id="view_depositor">Payer : Waiting...</p>
            <p id="view_amount">Amount : Waiting...</p>
        </div>

        <div class="divider"></div>

        <form action="/main" method="post" style="margin:0;">
            <button type="submit" class="btn btn-back">← Back to Main</button>
        </form>

        <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
        <script>
            const contractAddress = "0x1efdf55131c1ce2a2a5b25f54280b75d51b95555";
            const contractABI = [
                {
                    "inputs": [
                        {
                            "internalType": "address",
                            "name": "customer_input",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "amount_input",
                            "type": "uint256"
                        }
                    ],
                    "name": "deposit_money",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "deposit_view",
                    "outputs": [
                        {
                            "internalType": "address",
                            "name": "",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "",
                            "type": "uint256"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ]
            const web3 = new Web3(Web3.givenProvider);
            const contract = new web3.eth.Contract(contractABI, contractAddress);
            
            async function deposit() {
                const accounts = await web3.eth.requestAccounts();
                console.log(accounts[0]);
                const depositor = document.getElementById("depositor").value;
                const amount = document.getElementById("amount").value;
                console.log(depositor, amount)

                await contract.methods.deposit_money(depositor, amount).send({ from: accounts[0] });
            }
            
            async function view_transaction() {
                result = await contract.methods.deposit_view().call();
                console.log(result[0], result[1]);
                document.getElementById("view_depositor").innerText = "Payer : " + result[0];
                document.getElementById("view_amount").innerText = "Amount : " + result[1];
            }
        </script>
    </div>
</body>
</html>
