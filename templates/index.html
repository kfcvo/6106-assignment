<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 6101 Banking</title>
    <style>
        /* 重置基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 使用深蓝渐变背景，营造金融系统的安全感 */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 登录卡片 */
        .login-card {
            background-color: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            /* 简单的入场动画 */
            animation: fadeInDown 0.8s ease;
        }

        /* Logo 图标区域 */
        .logo-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 表单样式 */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px; /* 输入框和按钮之间的间距 */
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background-color: #f9f9f9;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        /* 提交按钮样式 */
        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2; /* 品牌蓝 */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #357abd;
            transform: translateY(-2px); /* 悬浮微微上浮 */
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        /* 简单的动画定义 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <div class="logo-icon">🏦</div>
        <h2>Welcome to 6101</h2>
        <p>Please log in to manage your assets</p>
        
        <form action="/main" method="post">
            <input type="text" name="q" placeholder="Enter your username" required autocomplete="off">
            <input type="submit" value="Login">
        </form>
    </div>

</body>
</html>
