<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <title>System Notification</title>
    <style>
        /* 复用之前的卡片样式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* 消息内容的样式 */
        .message-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            border-left: 5px solid #4a90e2; /* 默认蓝色边条 */
            text-align: left;
            
            /* 如果内容很多（比如Log），允许滚动 */
            max-height: 300px;
            overflow-y: auto; 
            font-family: monospace; /* Log通常用等宽字体看比较舒服 */
        }

        /* 成功/删除类型的特殊样式 (可选) */
        .success-mode {
            border-left-color: #2ecc71; /* 绿色 */
            font-family: 'Segoe UI', sans-serif; /* 普通消息不用等宽字体 */
            text-align: center;
        }

        /* 返回按钮 */
        .btn-back {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            background-color: transparent;
            color: #666;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background-color: #f1f1f1;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ title if title else 'System Message' }}</h2>
        
        <div class="message-box {{ 'success-mode' if is_success else '' }}">
            {{ content if content else r }}
        </div>

        <form action="/main" method="post" style="margin:0;">
            <button type="submit" class="btn-back">← Back to Main</button>
        </form>
    </div>
</body>
</html>
